# Veröffentlicht TROPHEON bei jedem Push auf "main" automatisch auf Firebase Hosting
# Benötigt das GitHub-Secret FIREBASE_SERVICE_ACCOUNT und die Variable FIREBASE_READY=true
# (Anleitung im README, Schritt 7B).
name: Deploy zu Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
