<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TROPHEON</title>
<meta name="description" content="Ancient Roots. Modern Nutrition. – Essen fotografieren, Kalorien, Makros und Vitamine tracken.">
<meta name="theme-color" content="#ecebe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TROPHEON">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{const t=localStorage.getItem('tropheon.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<section id="login" class="login" hidden>
  <div class="login-in">
    <div class="meander" aria-hidden="true"></div>
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true"><use href="#amphora"/></svg>
    <h1 class="wordmark">TROPHEON</h1>
    <p class="tagline">Ancient Roots. Modern Nutrition.</p>
    <p class="login-copy">Fotografiere deinen Teller – TROPHEON erkennt die Speisen und schätzt Kalorien, Protein, Vitamine und Mineralstoffe. Deine Tage, Ziele und dein Verlauf werden in deinem Konto gespeichert.</p>
    <button class="primary wide" id="btn-google"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22zM6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14zM12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>Mit Google anmelden</button>
    <button class="link" id="btn-local">Ohne Konto fortfahren (nur auf diesem Gerät)</button>
    <p class="login-err" id="login-err" hidden></p>
    <div class="meander" aria-hidden="true"></div>
  </div>
</section>

<main id="app" aria-live="polite"></main>

<nav class="tabs" id="tabs" aria-label="Bereiche" hidden><div class="tabs-in">
  <button class="tab" data-action="tab" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Tag</span><small>ΗΜΕΡΑ</small></button>
  <button class="tab" data-action="tab" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21h18M4 18h16M6 18V8M10 18V8M14 18V8M18 18V8M3 8h18L12 3z"/></svg><span>Verlauf</span><small>ΧΡΟΝΙΚΑ</small></button>
  <button class="tab" data-action="tab" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c.8-4.5 3.6-7 7-7s6.2 2.5 7 7"/></svg><span>Profil</span><small>ΣΩΜΑ</small></button>
</div></nav>

<button class="fab" id="fab" data-action="open-add" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Essen erfassen</button>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="amphora" viewBox="0 0 120 120">
      <path fill="var(--accent)" d="M47 10h26v6h-4v10c0 3 2 5 5 6 14 5 24 18 24 34 0 20-13 35-24 42v4h4v6H42v-6h4v-4C35 101 22 86 22 66c0-16 10-29 24-34 3-1 5-3 5-6V16h-4z"/>
      <path fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" d="M51 22c-14 0-18 10-14 20M69 22c14 0 18 10 14 20"/>
      <path fill="var(--ink)" d="M30 58h60v5H30zM27 78h66v5H27z"/>
      <path fill="var(--ink)" d="M44 64h32v13H44z" opacity=".9"/>
      <path fill="var(--accent)" d="M48 66h4v9h-4zm8 0h4v9h-4zm8 0h4v9h-4z"/>
    </symbol>
  </defs>
</svg>

<script type="module" src="app.js"></script>
</body>
</html>
